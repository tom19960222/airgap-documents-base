name = "rook-1.20"
collection = "rook"
version = "1.20.7"
source_type = "git"
repo_url = "https://github.com/rook/rook"
# Peeled commit for the official annotated v1.20.7 tag.
git_ref = "95a8e2a8b61cf7f8152213939f995c88a2e72ab6"
docs_paths = ["Documentation"]
sparse_paths = ["Documentation"]
# Match the exclusions used by Rook's mkdocs.yml so the corpus contains the
